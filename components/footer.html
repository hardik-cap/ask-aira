<!-- aiRA footer (Metaforms-style, 16 Sep): brand block on the left carrying
     the logo, the one-line positioning and the social row; link columns on
     the right; the giant wordmark across the full width beneath them; and a
     rule-topped legal row last, copyright left and legal links right.
     Injected into #footer-placeholder by js/components.js. -->
<footer class="footer">
  <!-- The frame's crossing mark where the footer's two rails meet its top
       edge (23 Sep). Every other section boundary gets one from its .joint;
       the footer's did not, so its rails began out of nothing, and on pages
       whose last section has no joint above the footer (product.html, and
       index.html since its stranded one was parked) there was no mark at that
       boundary at all. Desktop only, with the rails it marks. -->
  <span class="footer__crossing" aria-hidden="true"></span>
  <div class="padding-global">
    <div class="container">

      <div class="footer__grid">
        <div class="footer__brand reveal">
          <a class="footer__logo" href="/" aria-label="aiRA by Capillary, home">
            <img class="footer__logo-light" src="/assets/brand/aira-lockup.png" alt="aiRA by Capillary" width="78" height="26">
            <img class="footer__logo-dark" src="/assets/brand/aira-lockup-reverse.png" alt="aiRA by Capillary" width="78" height="26">
          </a>
          <!-- THE HERO'S OWN CLAIM, not a second one (user, 27 Sep: "tagline in
               footer needs to be same as Hero Section"). It is the static half of
               index.html's H1, without the rotating team word: the footer closes
               every page, so a different line here reads as a second positioning
               rather than the same one restated. Was "Between your data and your
               channels.", which was context.md 1's mechanism line. -->
          <p class="footer__line">On-demand insights and analytics agent.</p>
          <ul class="footer__social">
            <li>
              <a href="https://www.linkedin.com/company/askaira-ai/" rel="noopener"
                 aria-label="aiRA on LinkedIn">
                <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                  <path d="M4.68938 13.9414H2.19817V6.00487H4.68938V13.9414ZM11.0331 5.8076C13.5556 5.80761 14.0204 7.4507 14.0204 9.58788L14.0195 13.9414H11.5312V10.083C11.5312 9.16272 11.5141 7.97752 10.2363 7.97752C8.94014 7.97762 8.74212 8.98038 8.74212 10.0156V13.9414H6.25286V6.00487H8.64251V7.08983H8.67571C8.91482 6.68505 9.2606 6.3517 9.67571 6.12596C10.0908 5.90033 10.56 5.79021 11.0331 5.8076ZM3.16204 2.08788C3.44219 2.03265 3.73307 2.06074 3.997 2.16893C4.26087 2.2771 4.4867 2.46024 4.64544 2.6953C4.80418 2.93045 4.88855 3.20738 4.8886 3.49022C4.88863 3.67786 4.85166 3.86371 4.77923 4.0371C4.70668 4.21061 4.59984 4.36912 4.46575 4.50194C4.33173 4.63461 4.17208 4.73967 3.997 4.81151C3.82188 4.88332 3.63382 4.92085 3.44427 4.92088C3.15884 4.92084 2.87989 4.83661 2.64251 4.67967C2.40501 4.5226 2.21965 4.29931 2.11028 4.03807C2.00094 3.77682 1.97261 3.48928 2.02825 3.2119C2.08392 2.93455 2.22091 2.67949 2.42278 2.47948C2.62464 2.27953 2.88204 2.14316 3.16204 2.08788Z" fill="currentColor"/>
                </svg>
              </a>
            </li>
            <li>
              <a href="https://www.youtube.com/@Capillary_aira" rel="noopener"
                 aria-label="aiRA on YouTube">
                <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                  <path d="M8 14C8.0013 14 13.0031 14.0003 14.251 13.665C14.9394 13.4804 15.482 12.9365 15.666 12.2461C16.0004 10.9944 16 8.38281 16 8.38281C16 8.35899 15.9987 5.76644 15.666 4.52051C15.482 3.82998 14.9394 3.28611 14.251 3.10156C13.0033 2.76623 8.0013 2.76563 8 2.76562C8 2.76562 2.99689 2.76619 1.74902 3.10156C1.06063 3.28611 0.517969 3.82998 0.333984 4.52051C0.00128595 5.76644 7.0398e-06 8.35899 1.5904e-09 8.38281C1.5904e-09 8.38281 -0.00035472 10.9944 0.333984 12.2461C0.518005 12.9365 1.06068 13.4804 1.74902 13.665C2.99713 14.0003 8 14 8 14ZM6.36426 6.01172L10.5459 8.38281L6.36426 10.7539V6.01172Z" fill="currentColor"/>
                </svg>
              </a>
            </li>
          </ul>
        </div>

        <div class="footer__cols reveal reveal-stagger">
          <div class="footer__col">
            <h3 class="footer__col-title">Product</h3>
            <ul class="footer__col-list">
              <!-- A column heading is a category, not a link, so the section's
                   own page needs a row of its own: "Overview" and not
                   "Product", which would repeat the heading a line below
                   itself. Not "Platform" either (22 Sep) - the comparison
                   board on / and /product heads the OTHER column "Horizontal
                   AI analytics platforms", so that word is the category aiRA
                   argues against. -->
              <li><a href="/product">Overview</a></li>
              <!-- BACK 3 Oct with the page. The Product column is two rows
                   again rather than the one "Overview" it carried while
                   /pricing was parked, which is what the note on
                   .footer__cols meant by the grid sizing itself: no
                   stylesheet edit was needed for either direction. -->
              <!-- PARKED 12 Oct with the page (user).
              <li><a href="/pricing">Pricing</a></li>
              -->
              <!-- HIDDEN 28 Sep (user: "hide pricing, security, about us from
                   footer as we dont have those pages"). /security has NEVER been
                   built and this link 404d from the day it was written, which is
                   the longest-standing dead link on the site. Uncomment it the
                   day the page exists, not before. context.md 20 is the argument
                   for building it: security, privacy and IT governance was the
                   number one hesitation in the buyer research, raised unprompted
                   by 11 of 30. /product's #governance carries that argument for
                   now.
              <li><a href="/security">Security</a></li>
              -->
            </ul>
          </div>

          <div class="footer__col">
            <h3 class="footer__col-title">Solutions</h3>
            <ul class="footer__col-list">
              <!-- The five industries, matching the nav drawer's "By industry"
                   rail exactly. The eight retail categories were listed here too
                   until 16 Sep, which made this column four times the height of
                   the other two and turned a footer into a sitemap; they live in
                   the nav drawer instead. -->
              <li><a href="/solutions/retail">Retail</a></li>
              <li><a href="/solutions/restaurants-qsr">Restaurants &amp; QSR</a></li>
              <li><a href="/solutions/travel-hospitality">Travel &amp; Hospitality</a></li>
              <li><a href="/solutions/telecom">Telecom</a></li>
            </ul>
          </div>

          <!-- THE COMPANY COLUMN CAME BACK on 28 Sep with /about itself, and
               it holds ONE row rather than the two it had. It was hidden
               earlier the same day (user: "hide pricing, security, about us
               from footer as we dont have those pages. also remove contact"),
               wrapper included, because a column heading with nothing under it
               is worse than no column. "About us" was one of those two and the
               reason it went is gone: /about ships again, so this points at the
               site's own page rather than at capillarytech.com/about-us, which
               is where it fell back to while the page was parked.
               CONTACT DOES NOT COME BACK WITH IT. It was a mailto rather than a
               page, so it was never 404ing and was named separately from the
               three dead links, which makes it a removal on its own terms and
               not a casualty of the parking. Restore it only on a fresh ask, or
               when IA 10's /contact page exists.
               ONE ROW IS THE HONEST STATE. It becomes a real column when
               /customers and /contact are built, which is the same threshold
               the navbar note uses for turning About into a Company dropdown.
               .footer__cols sizes itself from the number of columns present, so
               this div returning is the only edit the footer needed. -->
          <div class="footer__col">
            <h3 class="footer__col-title">Company</h3>
            <ul class="footer__col-list">
              <li><a href="/about">About</a></li>
              <!-- PARKED 12 Oct with the page (user).
              <li><a href="/customers">Customers</a></li>
              -->
              <!-- EVENTS (10 Oct, user): the workshop hub. Footer only for now;
                   the navbar is near full at 992. -->
              <li><a href="/events">Events</a></li>
              <!-- CONTACT IS BACK 4 Oct (user: "contact page is basically book
                   page"), and it points at /book on purpose: there is no
                   /contact page, because a booking request IS the contact
                   route and a second form would split the leads. -->
              <li><a href="/book">Contact</a></li>
            </ul>
          </div>
        </div>
      </div>

      <div class="footer__bottom">

        <!-- Direct children of .footer__bottom, not wrapped: the row is
             space-between, so a wrapper would keep them bunched on the left. -->
        <p class="footer__legal">
          &copy; 2026 aiRA by Capillary
        </p>
        <ul class="footer__bottom-links">
          <!-- Full names, not "Terms" and "Privacy" (22 Sep): the pages are
               called Terms & Conditions and Privacy Policy, and the footer is
               the only place they are named. -->
          <li><a href="/terms-and-conditions">Terms &amp; Conditions</a></li>
          <li><a href="/privacy-policy">Privacy Policy</a></li>
        </ul>
      </div>

           an <img> gives CSS and JS nothing to hold. Geometry is the eight
           paths of /assets/brand/aira-footer.svg verbatim; if that file is
           ever redrawn, re-paste its paths into the <defs> group below. -->
      <div class="footer__wordmark" aria-hidden="true">
